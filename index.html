<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三國地圖 · 兵裝據點</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>三國兵裝據點地圖 <span class="update-date">20260803</span></h1>
    <div class="header-status" id="status"></div>
    <button id="resetBtn" class="reset-btn" title="清除選取與高亮">重設</button>
  </header>

  <main class="layout">
    <section class="map-panel">
      <div class="map-viewport" id="mapViewport">
        <div class="map-wrap" id="mapWrap">
          <img id="mapImg" src="assets/map.png" alt="三國地圖">
          <div id="markersLayer"></div>
        </div>
      </div>
      <div class="zoom-controls">
        <button id="zoomOutBtn" title="縮小">−</button>
        <button id="zoomResetBtn" title="重置縮放">100%</button>
        <button id="zoomInBtn" title="放大">＋</button>
      </div>
      <div id="detailPanel" class="detail-panel">
        <div class="dp-head">
          <span class="dp-name" id="dpName">尚未選取據點</span>
          <button id="dpClose" class="dp-close" title="關閉">✕</button>
        </div>
        <div class="dp-body" id="dpItems"></div>
        <div class="dp-section dp-qty">
          <span class="dp-label">數量</span>
          <input type="number" id="qtyInput" class="dp-input" value="1" min="1" step="1" title="以數量計算所需資源">
        </div>
        <div class="dp-section">
          <span class="dp-label">合計所需</span>
          <div id="dpTotals" class="materials"></div>
        </div>
        <div class="dp-section">
          <div class="dp-res-head">
            <span class="dp-label">我的資源</span>
            <label class="dp-switch" title="開啟後，資源不足時顯示紅字警示">
              <input type="checkbox" id="resToggle">
              <span class="dp-switch-track"></span>
              <span class="dp-switch-text">顯示不足警示</span>
            </label>
          </div>
          <div class="dp-res-grid">
            <label class="dp-res-field"><img class="res-icon" src="assets/resources/pi.png" alt="皮">皮<input type="number" id="resPi" class="dp-input" min="0" step="1" value="0"></label>
            <label class="dp-res-field"><img class="res-icon" src="assets/resources/tie.png" alt="鐵">鐵<input type="number" id="resTie" class="dp-input" min="0" step="1" value="0"></label>
            <label class="dp-res-field"><img class="res-icon" src="assets/resources/renpi.png" alt="韌皮">韌皮<input type="number" id="resRen" class="dp-input" min="0" step="1" value="0"></label>
            <label class="dp-res-field"><img class="res-icon" src="assets/resources/jingtie.png" alt="精鐵">精鐵<input type="number" id="resJing" class="dp-input" min="0" step="1" value="0"></label>
          </div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>兵裝清單</h2>
        <p class="hint">點擊兵裝名稱 → 地圖高亮可製造的據點<br>點擊據點 → 查看該處可造兵裝與材料</p>
      </div>
      <ul id="itemList"></ul>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
