<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d8b0"/>
      <stop offset="1" stop-color="#d8c094"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="rgba(90,60,20,0)"/>
      <stop offset="1" stop-color="rgba(90,60,20,0.28)"/>
    </radialGradient>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#b79a62" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="8" y="8" width="1584" height="884" fill="none" stroke="#7a5c2e" stroke-width="4"/>

  <g fill="#7d8f7a" stroke="#5f745d" stroke-width="2" stroke-opacity="0.5">
    <rect x="300" y="260" width="260" height="180" rx="70" opacity="0.8"/>
    <rect x="760" y="480" width="340" height="200" rx="90" opacity="0.85"/>
    <rect x="960" y="280" width="180" height="120" rx="50" opacity="0.7"/>
    <rect x="150" y="620" width="300" height="170" rx="80" opacity="0.75"/>
  </g>

  <g stroke="#6d8aa8" fill="#aac4dd" stroke-width="3" fill-opacity="0.55" stroke-opacity="0.75">
    <path d="M0 330 C300 320 420 380 560 360 S820 300 1000 340 S1400 300 1600 330 L1600 300 L0 300 Z"/>
    <path d="M620 400 C680 430 760 460 860 440 S980 410 1020 460 S1060 540 980 580 S840 600 740 560 S620 480 620 400 Z"/>
    <path d="M120 820 C220 800 300 760 420 780 S640 800 760 780"/>
    <path d="M1120 0 C1140 120 1080 200 1160 320"/>
  </g>

  <g font-family="KaiTi, STKaiti, serif" font-size="42" fill="#6b5629" text-anchor="middle" font-weight="bold" opacity="0.75">
    <text x="430" y="330">涼州</text>
    <text x="1080" y="260">冀州</text>
    <text x="830" y="200">幽州</text>
    <text x="780" y="340">兗州</text>
    <text x="980" y="370">青州</text>
    <text x="900" y="560">徐州</text>
    <text x="680" y="480">豫州</text>
    <text x="420" y="540">益州</text>
    <text x="800" y="650">荊州</text>
    <text x="1120" y="700">揚州</text>
    <text x="260" y="720">南中</text>
  </g>

  <g font-family="KaiTi, STKaiti, serif" font-size="64" fill="#3f2f14" text-anchor="middle" font-weight="bold">
    <text x="800" y="120">三國兵裝據點地圖</text>
    <text x="800" y="168" font-size="24" fill="#7a5c2e">（示意圖 · 待替換為正式地圖）</text>
  </g>
</svg>
